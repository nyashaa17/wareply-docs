openapi: 3.1.0
info:
  title: Wareply Developer API
  version: 1.0.0
  description: 'Authoritative OpenAPI 3.1 specification for the Wareply Developer API.


    The Wareply Developer API enables programmatic interaction with WhatsApp business accounts

    connected to your Wareply workspace. Build automations, send notifications, broadcast updates,

    manage customer messaging workflows, and schedule campaigns across direct messages, groups,

    and channels over connected WhatsApp multi-device sessions.


    ### Architectural Principles

    - **Bearer Authentication**: Cryptographic API keys (`wrp_live_<64-hex>`) resolved per-request.

    - **Strict Tenant Isolation**: Workspace boundaries and account restrictions are server-enforced.

    - **Rate Limiting**: 60 requests per minute per API key enforced globally across Developer API routes.

    - **Atomic Quota Reservation**: Operational message quota is atomically held before dispatch and refunded on failure.

    - **Distributed Idempotency**: Safe mutation retries with `Idempotency-Key` across a 24-hour retention window.

    - **Anti-Abuse Pacing**: WhatsApp message delivery pacing (minimum 500ms delay) cannot be bypassed.

    - **Standardized Envelopes**: All successful responses return `{ "data": ... }` and errors return `{ "error": { "code",
    "message", "request_id" } }`.'
  contact:
    name: Wareply Developer Support
    url: https://wareply.co.zw
servers:
- url: https://wareply.co.zw
  description: Production API Server
- url: /
  description: Current Host / Local Proxy
tags:
- name: Identity
  description: Credential verification, tenant workspace resolution, and commercial plan entitlements
- name: Accounts
  description: Connected WhatsApp business account discovery, phone number resolution, and status inspection
- name: Direct Messaging
  description: Transactional 1-to-1 WhatsApp text and media message dispatch and status inspection
- name: Groups
  description: WhatsApp group roster queries, cache synchronization, and group messaging
- name: Channels
  description: WhatsApp channel / newsletter listing, metadata, and broadcast publishing
- name: Templates
  description: Reusable message template creation, dynamic variable extraction, and lifecycle
- name: Broadcasts
  description: Multi-recipient campaign dispatch (up to 1,000 targets) with quota reservation and safe cancellation
- name: Schedules
  description: Scheduled broadcast inspection, listing, and cancellation with 100% quota refund
- name: Diagnostics
  description: Diagnostic idempotency pipeline verification
paths:
  /api/v1/me:
    get:
      operationId: getDeveloperMe
      tags:
      - Identity
      summary: Verify Developer API credentials and tenancy
      description: 'Diagnostic verification endpoint that resolves the authenticated API key, tenant workspace,

        granted scopes, account restrictions, and commercial subscription tier.

        Never leaks raw secrets, credentials, or internal topology.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      responses:
        "200":
          description: Credentials verified and tenancy context returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperMeResult'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
  /api/v1/accounts:
    get:
      operationId: listDeveloperAccounts
      tags:
      - Accounts
      summary: List accessible WhatsApp accounts
      description: 'Discovers active, connected WhatsApp business accounts accessible to the authenticated API key within the tenant workspace.

        Requires `accounts:read` scope. Supports search, status filtering, and pagination. Never leaks credentials, auth state, or cross-tenant accounts.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      - name: status
        in: query
        required: false
        description: Filter accounts by status (e.g. active, connecting, qr, disconnected)
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: Case-insensitive search query matching account name or phone number
        schema:
          type: string
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/OffsetQuery'
      responses:
        "200":
          description: List of accessible accounts returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResult'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
  /api/v1/messages/send:
    post:
      operationId: sendDirectMessage
      tags:
      - Direct Messaging
      summary: Send a direct WhatsApp message
      description: 'Sends a direct 1-to-1 text or media WhatsApp message to a validated recipient phone number

        in international E.164 format through the account''s connected WhatsApp session.

        Requires `messages:send` scope and consumes 1 unit of message quota.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        description: Direct message parameters including target account, recipient phone number, and message content
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendDirectMessageRequest'
      responses:
        "200":
          description: Message accepted and dispatched to WhatsApp engine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendDirectMessageResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "409":
          $ref: '#/components/responses/Error409Conflict'
        "422":
          $ref: '#/components/responses/Error422Unprocessable'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
        "502":
          $ref: '#/components/responses/Error502BadGateway'
        "504":
          $ref: '#/components/responses/Error504GatewayTimeout'
  /api/v1/messages/{id}:
    get:
      operationId: getDirectMessage
      tags:
      - Direct Messaging
      summary: Get direct message operation status
      description: 'Retrieves the operational status and delivery metadata of a direct message operation by ID.

        Requires `messages:read` scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Unique direct message operation ID (e.g. `msg_...`)
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestIdHeader'
      responses:
        "200":
          description: Direct message operation status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendDirectMessageResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
  /api/v1/groups:
    get:
      operationId: listGroups
      tags:
      - Groups
      summary: List WhatsApp groups
      description: 'Cache-first listing of WhatsApp groups accessible to the account.

        Reads from cached group snapshot without triggering a WhatsApp socket request. Requires `groups:read` scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: account_id
        in: query
        required: true
        description: Target WhatsApp account UUID
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: Optional search filter matching group name or JID
        schema:
          type: string
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/OffsetQuery'
      - $ref: '#/components/parameters/XRequestIdHeader'
      responses:
        "200":
          description: List of WhatsApp groups returned from cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
  /api/v1/groups/refresh:
    post:
      operationId: refreshGroups
      tags:
      - Groups
      summary: Refresh WhatsApp groups snapshot
      description: 'Explicit refresh operation that triggers synchronization of the group roster from the connected WhatsApp
        session.

        Requires `groups:read` scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: account_id
        in: query
        required: false
        description: Target WhatsApp account UUID (can alternatively be provided in request body)
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  description: Target WhatsApp account UUID
      responses:
        "200":
          description: Fresh group roster synchronized and cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRefreshResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
  /api/v1/groups/messages/{id}:
    get:
      operationId: getGroupMessage
      tags:
      - Groups
      summary: Get group message status
      description: 'Retrieves the status and delivery metadata of a group message operation by ID.

        Automatically executes active reconciliation if the operation was in `dispatch_uncertain` state. Requires `groups:read`
        scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Group message operation ID (e.g. `msg_grp_...`)
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestIdHeader'
      responses:
        "200":
          description: Group message operation details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMessageResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
  /api/v1/groups/messages:
    post:
      operationId: sendGroupMessage
      tags:
      - Groups
      summary: Send a message to a WhatsApp group
      description: 'Sends a text or media message to a WhatsApp group specified by `group_id` in the request body.

        Enforces WhatsApp delivery pacing and atomic quota reservation. Requires `groups:write` scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        description: Group message payload with target account, group JID, and text or media attachment
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendGroupMessageRequest'
      responses:
        "200":
          description: Message accepted and dispatched to WhatsApp group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMessageResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "409":
          $ref: '#/components/responses/Error409Conflict'
        "422":
          $ref: '#/components/responses/Error422Unprocessable'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
        "502":
          $ref: '#/components/responses/Error502BadGateway'
        "504":
          $ref: '#/components/responses/Error504GatewayTimeout'
  /api/v1/groups/{id}/messages:
    post:
      operationId: sendGroupMessageById
      tags:
      - Groups
      summary: Send a message to a WhatsApp group by path ID
      description: 'Sends a text or media message to the WhatsApp group identified in the URL path (`:id`).

        Requires `groups:write` scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: WhatsApp group JID (must end in `@g.us`)
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestIdHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        description: Group message payload with target account and text or media attachment
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendGroupMessageByPathRequest'
      responses:
        "200":
          description: Message accepted and dispatched to WhatsApp group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMessageResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "409":
          $ref: '#/components/responses/Error409Conflict'
        "422":
          $ref: '#/components/responses/Error422Unprocessable'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
        "502":
          $ref: '#/components/responses/Error502BadGateway'
        "504":
          $ref: '#/components/responses/Error504GatewayTimeout'
  /api/v1/groups/{id}:
    get:
      operationId: getGroup
      tags:
      - Groups
      summary: Get group metadata
      description: 'Retrieves metadata and participant count for a specific WhatsApp group from the cached snapshot.

        Requires `groups:read` scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: WhatsApp group JID (must end in `@g.us`)
        schema:
          type: string
      - name: account_id
        in: query
        required: true
        description: Target WhatsApp account UUID
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestIdHeader'
      responses:
        "200":
          description: Group metadata returned from cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetailsResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
  /api/v1/channels:
    get:
      operationId: listChannels
      tags:
      - Channels
      summary: List WhatsApp channels
      description: 'Cache-first listing of WhatsApp channels (newsletters) available to the account.

        Includes role and publisher permission flags (`admin`, `subscriber`). Requires `channels:read` scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: account_id
        in: query
        required: true
        description: Target WhatsApp account UUID
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: Optional search filter matching channel name or JID
        schema:
          type: string
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/OffsetQuery'
      - $ref: '#/components/parameters/XRequestIdHeader'
      responses:
        "200":
          description: List of WhatsApp channels returned from cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelListResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
  /api/v1/channels/refresh:
    post:
      operationId: refreshChannels
      tags:
      - Channels
      summary: Refresh WhatsApp channels snapshot
      description: 'Explicit refresh operation that triggers synchronization of subscribed and managed WhatsApp channels from
        the worker.

        Requires `channels:read` scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: account_id
        in: query
        required: false
        description: Target WhatsApp account UUID (can alternatively be provided in body)
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  description: Target WhatsApp account UUID
      responses:
        "200":
          description: Channel roster refreshed from WhatsApp session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelRefreshResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
  /api/v1/channels/messages/{id}:
    get:
      operationId: getChannelMessage
      tags:
      - Channels
      summary: Get channel message status
      description: 'Retrieves the status and delivery metadata of a channel update operation by ID.

        Automatically executes active reconciliation if in `dispatch_uncertain` state. Requires `channels:read` scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Channel message operation ID (e.g. `msg_ch_...`)
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestIdHeader'
      responses:
        "200":
          description: Channel update operation details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelMessageResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
  /api/v1/channels/messages:
    post:
      operationId: sendChannelMessage
      tags:
      - Channels
      summary: Send an update to a WhatsApp channel
      description: 'Publishes an announcement or message to a WhatsApp channel specified by `channel_id` in the request body.

        The connected account must possess publisher privileges (`owner` or `admin`) on the target channel.

        Requires `channels:write` scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        description: Channel update payload including target account, channel JID, and text or media attachment
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChannelMessageRequest'
      responses:
        "200":
          description: Update accepted and published to WhatsApp channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelMessageResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "409":
          $ref: '#/components/responses/Error409Conflict'
        "422":
          $ref: '#/components/responses/Error422Unprocessable'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
        "502":
          $ref: '#/components/responses/Error502BadGateway'
        "504":
          $ref: '#/components/responses/Error504GatewayTimeout'
  /api/v1/channels/{id}/messages:
    post:
      operationId: sendChannelMessageById
      tags:
      - Channels
      summary: Send an update to a WhatsApp channel by path ID
      description: 'Publishes an announcement or message to the WhatsApp channel specified in the URL path (`:id`).

        The connected account must possess publisher privileges (`owner` or `admin`). Requires `channels:write` scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: WhatsApp channel JID (must end in `@newsletter`)
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestIdHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        description: Channel update payload including target account and text or media attachment
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChannelMessageByPathRequest'
      responses:
        "200":
          description: Update accepted and published to WhatsApp channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelMessageResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "409":
          $ref: '#/components/responses/Error409Conflict'
        "422":
          $ref: '#/components/responses/Error422Unprocessable'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
        "502":
          $ref: '#/components/responses/Error502BadGateway'
        "504":
          $ref: '#/components/responses/Error504GatewayTimeout'
  /api/v1/channels/{id}:
    get:
      operationId: getChannel
      tags:
      - Channels
      summary: Get channel metadata
      description: 'Retrieves metadata and publisher role for a specific WhatsApp channel from the cached snapshot.

        Requires `channels:read` scope.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: WhatsApp channel JID (must end in `@newsletter`)
        schema:
          type: string
      - name: account_id
        in: query
        required: true
        description: Target WhatsApp account UUID
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestIdHeader'
      responses:
        "200":
          description: Channel details and publisher role returned from cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelDetailsResult'
        "400":
          $ref: '#/components/responses/Error400BadRequest'
        "401":
          $ref: '#/components/responses/Error401Unauthorized'
        "403":
          $ref: '#/components/responses/Error403Forbidden'
        "404":
          $ref: '#/components/responses/Error404NotFound'
        "429":
          $ref: '#/components/responses/Error429RateLimited'
        "500":
          $ref: '#/components/responses/Error500Internal'
  /api/v1/test-idempotency:
    post:
      operationId: testIdempotency
      tags:
      - Diagnostics
      summary: Diagnostic idempotency verification
      description: 'Diagnostic echo endpoint to verify client idempotency key generation, replay handling, and error branches

        without sending WhatsApp messages or deducting quota. Accessible with any valid API key.'
      security:
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        description: Arbitrary test payload to echo back
        content:
          application/json:
            schema:
              type: object
              description: Arbitrary JSON payload for idempotency verification
      responses:
        "200":
          description: Echo response returned
          headers:
            Idempotent-Replayed:
