components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: wrp_live_<64-hex>
      description: 'Wareply Developer API Key Bearer Authentication.

        Provide your API key in the `Authorization` header: `Authorization: Bearer wrp_live_...`.

        Each request automatically resolves the tenant workspace and authorized account restrictions.'
  parameters:
    XRequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client-supplied correlation request ID (1 to 128 characters)
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_-]{1,128}$
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique idempotency key to guarantee at-most-once execution across a 24-hour window (1 to 255 characters)
      schema:
        type: string
        maxLength: 255
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return (1-100, default 50)
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    OffsetQuery:
      name: offset
      in: query
      required: false
      description: Number of records to skip for pagination (default 0)
      schema:
        type: integer
        default: 0
        minimum: 0
  headers:
    XRequestId:
      description: Unique correlation request ID echoed back by the server
      schema:
        type: string
    XRateLimitLimit:
      description: Permitted request limit per 60-second window (60 requests/minute per API key, global across Developer API routes)
      schema:
        type: string
        example: '60'
    XRateLimitRemaining:
      description: Remaining allowed requests in the current window
      schema:
        type: string
        example: '59'
    XRateLimitReset:
      description: Unix epoch timestamp when the current rate limit window resets
      schema:
        type: string
        example: '1789291260'
    RetryAfter:
      description: Seconds to wait before retrying after receiving a 429 response
      schema:
        type: string
        example: '14'
    IdempotentReplayed:
      description: Present and true if this response was replayed from a previous cached execution
      schema:
        type: string
  responses:
    Error400BadRequest:
      description: Bad Request — Malformed payload, invalid recipient format, or missing required parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeveloperErrorEnvelope'
    Error401Unauthorized:
      description: Unauthorized — Missing, invalid, expired, or revoked API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeveloperErrorEnvelope'
    Error403Forbidden:
      description: Forbidden — Insufficient scope, restricted account access, suspended workspace, or commercial plan upgrade
        required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeveloperErrorEnvelope'
    Error404NotFound:
      description: Not Found — Requested resource, account, message, or template not found in workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeveloperErrorEnvelope'
    Error409Conflict:
      description: Conflict — Concurrent in-flight idempotency request or resource in non-modifiable state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeveloperErrorEnvelope'
    Error422Unprocessable:
      description: Unprocessable Entity — Idempotency key reused with mismatched request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeveloperErrorEnvelope'
    Error429RateLimited:
      description: Too Many Requests — Rate limit exceeded (60 requests/minute per API key across Developer API routes)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeveloperErrorEnvelope'
    Error500Internal:
      description: Internal Server Error — Unexpected error occurred (sanitized message without internal leakage)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeveloperErrorEnvelope'
    Error502BadGateway:
      description: Bad Gateway — Definitive WhatsApp engine delivery failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeveloperErrorEnvelope'
    Error504GatewayTimeout:
      description: Gateway Timeout — Ambiguous dispatch failure (dispatch_uncertain). Status must be verified via polling
        or retried with same idempotency key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeveloperErrorEnvelope'
  schemas:
    DeveloperErrorCode:
      type: string
      enum:
      - invalid_request
      - unauthorized
      - forbidden
      - not_found
      - conflict
      - rate_limited
      - quota_exceeded
      - idempotency_conflict
      - idempotency_key_mismatch
      - validation_error
      - account_unavailable
      - internal_error
      - plan_upgrade_required
      - insufficient_scope
      - account_access_denied
      - invalid_recipient
      - message_failed
      - dispatch_uncertain
    DeveloperError:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          $ref: '#/components/schemas/DeveloperErrorCode'
        message:
          type: string
          description: Sanitized error explanation safe for external display (all internal paths and queries scrubbed)
        request_id:
          type: string
          description: Unique correlation request ID matching X-Request-ID header
        details:
          nullable: true
          description: Optional structured debugging context
    DeveloperErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/DeveloperError'
    PaginationMetadata:
      type: object
      required:
      - limit
      - offset
      - total
      properties:
        limit:
          type: integer
          description: Page size limit applied to the query
        offset:
          type: integer
          description: Page offset applied to the query
        total:
          type: integer
          description: Total matching records in workspace
    AccountRecord:
      type: object
      required:
      - id
      - name
      - status
      - created_at
      properties:
        id:
          type: string
          description: Unique account identifier (UUID)
          example: acc_01j4k6b49...
        name:
          type: string
          description: Account display name
          example: Customer Support Line
        label:
          type: string
          nullable: true
          description: Optional account label / category
          example: Primary Support
        phone_number:
          type: string
          nullable: true
          description: Connected WhatsApp phone number in E.164 format
          example: '+263771234567'
        phoneNumber:
          type: string
          nullable: true
          deprecated: true
          description: Deprecated camelCase alias for phone_number
          example: '+263771234567'
        status:
          type: string
          description: WhatsApp session connectivity status
          example: active
        created_at:
          type: string
          format: date-time
          description: Account registration timestamp (ISO 8601)
          example: '2026-09-01T10:00:00.000Z'
        createdAt:
          type: string
          format: date-time
          deprecated: true
          description: Deprecated camelCase alias for created_at
          example: '2026-09-01T10:00:00.000Z'
    AccountListResponseData:
      type: object
      required:
      - accounts
      - total
      - limit
      - offset
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountRecord'
